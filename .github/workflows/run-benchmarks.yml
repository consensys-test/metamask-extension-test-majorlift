name: Run benchmarks

on:
  workflow_call:
    inputs:
      builds-from-run:
        required: true
        type: string
        description: The run ID to get builds from
      base-builds-from-run:
        required: false
        type: string
        default: ''
        description: >-
          The run ID to get the base commit's builds from. Set, each chrome job
          runs the base and head builds paired in one job (BENCHMARK_PAIRED,
          test/e2e/benchmarks/utils/paired.ts), once leading with each build

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  benchmarks:
    if: ${{ github.event_name != 'merge_group' }} # Skip this job for the Merge Queue
    name: ${{ matrix.browser }}-${{ matrix.buildType }}-${{ matrix.pairedOrder != '' && format('{0}-{1}{2}', matrix.pairedFlow.name, matrix.pairedOrder, matrix.suffix) || matrix.pageType }}
    # We decide whether to block the PR in the `quality-gate` step
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # Preset names are defined in test/e2e/benchmarks/utils/constants.ts
        # and must stay in sync with benchmark-command (startupPowerUserHome uses extra flags).
        #
        # Startup + interaction + user journeys: chrome/firefox × webpack × preset (test build: build-test-webpack / build-test-mv2-webpack).
        browser: [chrome, firefox]
        buildType: [webpack]
        # Unset `base-builds-from-run`: one job per preset, as before, and
        # `pairedFlow` and `pairedOrder` are each the one empty value.
        pageType: ${{ fromJSON(inputs.base-builds-from-run == '' && '["startupStandardHome","startupPowerUserHome","interactionUserActions","userJourneyOnboardingImport","userJourneyOnboardingNew","userJourneyAssets","userJourneyTransactions","userJourneyAccountManagement"]' || '[""]') }}
        # Set: one job per flow file instead, run through the runner's `file`
        # argument, and `pageType` is the one empty value. A paired job runs its
        # flow six times (a warm-up run and two measured runs of each build), so a
        # preset of two or three flows in one job would pass the 25-minute step
        # at 5 iterations a run. Each entry is a flow's result key, which the
        # runner derives from the file name whatever the preset, and its file:
        # every flow of the presets above that the runner iterates, and the
        # standard-home startup flow, whose paired run is one startup run of
        # BENCHMARK_PAIRED_BROWSER_LOADS browser loads (not the power-user
        # startup flow, not the dapp page load).
        # Paired window (pw), arm uk: one `entry` per job of this arm in place of the flow table.
        # Each `include` entry below is keyed on its own `entry` value, so it joins that entry's two jobs
        # (one per order) only, adding the flow file, the artifact suffix and the command prefix.
        entry:
          - knav
          - kui
        # Paired jobs, when `base-builds-from-run` is set: each job runs the
        # base and head builds in one of the two orders ADR 0072's paired
        # comparator alternates, so every head gets one job of each. Unset, the
        # one empty value leaves the matrix as it was.
        pairedOrder: ${{ fromJSON(inputs.base-builds-from-run != '' && '["base-head-head-base","head-base-base-head"]' || '[""]') }}
        # The runner pairs Chrome only (Firefox reuses a cached .xpi across
        # builds). startupPowerUserHome is not among the paired flows above.
        exclude:
          - browser: firefox
            pairedOrder: base-head-head-base
          - browser: firefox
            pairedOrder: head-base-base-head
        include:
          - entry: knav
            pairedFlow: {"name": "startupStandardHome", "file": "test/e2e/benchmarks/flows/startup/standard-home.ts"}
            suffix: '-knav'
            prefix: 'BENCHMARK_KNOWN_ANSWER_STARTUP_DELAY_MS=188 BENCHMARK_STARTUP_POST_HERO_LONG_TASKS=1 '
          - entry: kui
            pairedFlow: {"name": "startupStandardHome", "file": "test/e2e/benchmarks/flows/startup/standard-home.ts"}
            suffix: '-kui'
            prefix: 'BENCHMARK_KNOWN_ANSWER_STARTUP_SYNC_BLOCK_MS=238 BENCHMARK_STARTUP_POST_HERO_LONG_TASKS=1 '
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Recorded into the artifact by `captureHostProvenance`. No GitHub context
      # exposes the label a job requested, so it is passed explicitly; keep it in
      # sync with this job's `runs-on`. `BENCHMARK_RUNNER_REGION` is deliberately
      # unset: GitHub-hosted runners do not expose the Azure region in the
      # environment, and guessing it is worse than leaving the field undefined.
      BENCHMARK_RUNNER_LABEL: ubuntu-latest
      # The job's results file. A paired job's name carries its order, so the
      # two jobs of one page type upload distinct artifacts.
      BENCHMARK_JSON: benchmark-${{ matrix.browser }}-${{ matrix.buildType }}-${{ matrix.pairedOrder != '' && format('{0}-{1}{2}', matrix.pairedFlow.name, matrix.pairedOrder, matrix.suffix) || matrix.pageType }}.json
      # Paired jobs only. The head build goes to head-build/ and the base build
      # to base-build/, and `dist` is left absent: the runner points it at each
      # build in turn. Unpaired, BENCHMARK_PAIRED is empty, which is off.
      BENCHMARK_PAIRED: ${{ matrix.pairedOrder != '' && '1' || '' }}
      BENCHMARK_PAIRED_ORDER: ${{ matrix.pairedOrder }}
      BENCHMARK_PAIRED_BASE_DIST: base-build/dist
      BENCHMARK_PAIRED_HEAD_DIST: head-build/dist
      # Paired jobs only: each run's iterations, the runner's `--iterations`
      # (a flow that sets its own count keeps it). 5 is the runner's default.
      BENCHMARK_PAIRED_ITERATIONS: '5'
      # Paired startup jobs only: each run's browser loads, of 10 page loads.
      # At 4 every recorded standard-home job's six runs fit the 25-minute step.
      BENCHMARK_PAIRED_BROWSER_LOADS: '4'
      # Startup jobs: '1' discards each startup run's first browser load, as
      # the runner always has; '0' keeps it. It reaches base and head alike.
      BENCHMARK_STARTUP_DISCARD_FIRST_BROWSER_LOAD: '1'
      # Zero arm of the composition check. The mocked quote delay is a
      # `setTimeout` inside the mockttp server, which runs in THIS job's Node
      # process -- not in the extension bundle -- so it belongs here and not on
      # the build job. `SENTRY_SAMPLE_RATE_OVERRIDES` is the opposite case and
      # sits in `run-build.yml`; putting that one here cost a void arm already.
      # UNSET for the production-configuration window: `performance-mocks.ts` reads
      # `Number(process.env.BENCHMARK_QUOTE_RESPONSE_DELAY_MS ?? 2000)` and
      # `origin/main` hardcodes `delayedCallback(2000, ...)` at the same site, so
      # leaving this absent reproduces what ships. Setting it to '' would NOT:
      # `Number('')` is 0, which is the arm this window exists to stop measuring.
      # Criterion 2, re-derived against the app-side delta_block. 2 x delta_block is
      # 89.50 ms (chrome) and 97.18 (firefox) on the 15-run zero-delay window, so 98
      # clears both -- 2.19x and 2.02x of delta_block, the ratios the 462 ms arm ran
      # at against the mock-inflated base. The 462 arm is 5.2x/4.8x too large to say
      # anything about the current threshold.
      BENCHMARK_KNOWN_ANSWER_QUOTE_DELAY_MS: '0'
      # V14 arm: force a second quote fetch by refilling the amount, and require
      # 2 `Swap Quote Fetch` spans. Read by `swap.ts` in THIS job's Node process,
      # so it belongs here rather than on the build job.
      BENCHMARK_V14_INJECT: ''
      # '0' for the production-configuration window: `mockDelayMs()` gates on
      # `=== '1'`, so every one of the 77 artificial delays applies, as on main.
      BENCHMARK_ZERO_MOCK_DELAYS: '0'
      SELENIUM_BROWSER: ${{ matrix.browser }}
      SELENIUM_HEADLESS: true
      INFURA_PROJECT_ID: ${{ secrets.INFURA_PROJECT_ID }}
      TEST_SRP_2: ${{ secrets.TEST_SRP_2 }}
      SENTRY_DSN_PERFORMANCE: ${{ vars.SENTRY_DSN_PERFORMANCE }}
      PR_NUMBER: ${{ github.event.pull_request.number || 'none' }}
      HEAD_COMMIT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}
      GITHUB_REF_NAME: ${{ github.head_ref || github.ref_name }}
      # main or release/* only — for S3 / AWS CLI (same ref semantics as Sentry).
      MAIN_OR_RELEASE: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          skip-allow-scripts: true

      - name: Install anvil with retry
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 1
          max_attempts: 4
          retry_wait_seconds: 30
          command: yarn mm-foundryup

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: build-test${{ matrix.browser == 'firefox' && '-mv2' || '' }}-${{ matrix.buildType }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.builds-from-run }}
          path: ${{ matrix.pairedOrder != '' && 'head-build' || github.workspace }}

      - name: Download the base commit's build artifact (paired jobs only)
        if: ${{ matrix.pairedOrder != '' }}
        uses: actions/download-artifact@v7
        with:
          name: build-test-${{ matrix.buildType }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.base-builds-from-run }}
          path: base-build

      - name: Pin geckodriver 0.36.0 (Firefox only)
        if: ${{ matrix.browser == 'firefox' }}
        run: .github/scripts/pin-geckodriver.sh

      - name: Run the benchmark
        # Job timeouts propogate to later jobs, step timeouts just cause job failure.
        # This must be set below the job timeout so that the job itself does not timeout.
        timeout-minutes: 25
        id: run-benchmark
        run: >-
          ${{ matrix.pageType == 'startupPowerUserHome' && format('yarn test:e2e:benchmark --preset startupPowerUserHome --browserLoads 15 --pageLoads 7 --out test-artifacts/benchmarks/benchmark-{0}-{1}-startupPowerUserHome.json --retries 2', matrix.browser, matrix.buildType) || matrix.pairedOrder != '' && startsWith(matrix.pairedFlow.name, 'startup') && format('{3}yarn test:e2e:benchmark {0} --browserLoads {1} --pageLoads 10 --out test-artifacts/benchmarks/{2} --retries 2', matrix.pairedFlow.file, env.BENCHMARK_PAIRED_BROWSER_LOADS, env.BENCHMARK_JSON, matrix.prefix) || matrix.pairedOrder != '' && format('{3}yarn test:e2e:benchmark {0} --iterations {1} --out test-artifacts/benchmarks/{2} --retries 2', matrix.pairedFlow.file, env.BENCHMARK_PAIRED_ITERATIONS, env.BENCHMARK_JSON, matrix.prefix) || format('yarn test:e2e:benchmark --preset {0} --out test-artifacts/benchmarks/{1} --retries 2', matrix.pageType, env.BENCHMARK_JSON) }}
        shell: bash

      - name: Send benchmark results to Sentry (main/release only)
        if: >-
          ${{
            vars.SENTRY_DSN_PERFORMANCE &&
            env.MAIN_OR_RELEASE == 'true'
          }}
        run: |
          export GITHUB_REF_NAME="${GH_HEAD_REF:-$GH_REF_NAME}"
          yarn tsx test/e2e/benchmarks/send-to-sentry.ts \
            --results "test-artifacts/benchmarks/${{ env.BENCHMARK_JSON }}" \
            --browser "${{ matrix.browser }}" \
            --buildType "${{ matrix.buildType }}"
        shell: bash
        env:
          GH_HEAD_REF: ${{ github.head_ref }}
          GH_REF_NAME: ${{ github.ref_name }}

      - name: Upload benchmark to S3
        if: >-
          ${{
            vars.AWS_REGION != '' &&
            vars.AWS_IAM_ROLE != '' &&
            vars.AWS_S3_BUCKET != ''
          }}
        uses: MetaMask/github-tools/.github/actions/upload-s3@v1
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_IAM_ROLE }}
          s3-bucket: ${{ vars.AWS_S3_BUCKET }}/${{ github.event.repository.name }}/${{ github.run_id }}/benchmarks/${{ env.BENCHMARK_JSON }}
          path: test-artifacts/benchmarks/${{ env.BENCHMARK_JSON }}

      - name: Upload benchmark result as GitHub artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.BENCHMARK_JSON }}
          path: test-artifacts/benchmarks/${{ env.BENCHMARK_JSON }}
          retention-days: 7
          if-no-files-found: ignore

      - name: Gate this benchmark leg
        if: ${{ steps.run-benchmark.outcome == 'success' }}
        run: yarn tsx development/metamaskbot-build-announce/compare-benchmarks.ts --current test-artifacts/benchmarks/
        shell: bash

  benchmarks-page-load:
    # Paired window (pw): no dapp job.
    if: ${{ false }}
    name: chrome-webpack-pageLoadBenchmark
    # We decide whether to block the PR in the `quality-gate` step
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'default-branch' || null }}
    env:
      # Recorded into the artifact by `captureHostProvenance`. No GitHub context
      # exposes the label a job requested, so it is passed explicitly; keep it in
      # sync with this job's `runs-on`. `BENCHMARK_RUNNER_REGION` is deliberately
      # unset: GitHub-hosted runners do not expose the Azure region in the
      # environment, and guessing it is worse than leaving the field undefined.
      BENCHMARK_RUNNER_LABEL: ubuntu-latest
      OWNER: ${{ github.repository_owner }}
      REPOSITORY: ${{ github.event.repository.name }}
      PR_NUMBER: ${{ github.event.pull_request.number || 'none' }}
      HEAD_COMMIT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}
      # Job env mirrors matrix job; step `if:` uses env.SENTRY_DSN_PERFORMANCE (same as send-to-sentry’s process.env).
      SENTRY_DSN_PERFORMANCE: ${{ vars.SENTRY_DSN_PERFORMANCE }}
      BENCHMARK_BROWSER_LOADS: '10'
      BENCHMARK_PAGE_LOADS: '10'
      DAPP_BENCHMARK_JSON: benchmark-chrome-webpack-pageLoadBenchmark.json
      MAIN_OR_RELEASE: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
    steps:
      - name: Checkout and setup environment
        uses: MetaMask/action-checkout-and-setup@v3
        with:
          is-high-risk-environment: false
          skip-allow-scripts: true

      - name: Download artifact 'build-test-webpack'
        uses: actions/download-artifact@v7
        with:
          name: build-test-webpack
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.builds-from-run }}

      - name: Install Playwright browsers
        uses: ./.github/actions/install-playwright-browsers
        with:
          browsers: chromium

      - name: Run dapp page load benchmarks
        # Job timeouts propogate to later jobs, step timeouts just cause job failure.
        # This must be set below the job timeout so that the job itself does not timeout.
        timeout-minutes: 25
        id: run-page-load
        run: yarn test:e2e:benchmark --preset=pageLoadBenchmark

      - name: Send benchmark results to Sentry (main/release only)
        if: >-
          ${{
            vars.SENTRY_DSN_PERFORMANCE &&
            env.MAIN_OR_RELEASE == 'true'
          }}
        run: |
          export GITHUB_REF_NAME="${GH_HEAD_REF:-$GH_REF_NAME}"
          yarn tsx test/e2e/benchmarks/send-to-sentry.ts \
            --results "test-artifacts/benchmarks/${{ env.DAPP_BENCHMARK_JSON }}" \
            --browser "chrome" \
            --buildType "webpack"
        shell: bash
        env:
          GH_HEAD_REF: ${{ github.head_ref }}
          GH_REF_NAME: ${{ github.ref_name }}

      - name: Upload benchmark to S3
        if: >-
          ${{
            vars.AWS_REGION != '' &&
            vars.AWS_IAM_ROLE != '' &&
            vars.AWS_S3_BUCKET != ''
          }}
        uses: MetaMask/github-tools/.github/actions/upload-s3@v1
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_IAM_ROLE }}
          s3-bucket: ${{ vars.AWS_S3_BUCKET }}/${{ github.event.repository.name }}/${{ github.run_id }}/benchmarks/${{ env.DAPP_BENCHMARK_JSON }}
          path: test-artifacts/benchmarks/${{ env.DAPP_BENCHMARK_JSON }}

      - name: Upload benchmark result as GitHub artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.DAPP_BENCHMARK_JSON }}
          path: test-artifacts/benchmarks/${{ env.DAPP_BENCHMARK_JSON }}
          retention-days: 7
          if-no-files-found: ignore

      - name: Gate this benchmark leg
        if: ${{ steps.run-page-load.outcome == 'success' }}
        run: yarn tsx development/metamaskbot-build-announce/compare-benchmarks.ts --current test-artifacts/benchmarks/
        shell: bash

  # Evaluates benchmark results against constant thresholds (THRESHOLD_REGISTRY).
  # Rollout across 4 phases:
  # - Phase 2: continue-on-error: true (non-blocking, informational).
  # - Phase 3: continue-on-error: false (red X in checks, not required).
  # - Phase 4: continue-on-error: false + added to branch protection required checks.
  quality-gate:
    name: quality-gate
    continue-on-error: false
    needs:
      - benchmarks
      - benchmarks-page-load
    if: >-
      ${{
        !cancelled() &&
        github.event_name != 'merge_group'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout quality-gate sources
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .nvmrc
            tsconfig.json
            development/metamaskbot-build-announce
            shared/constants/benchmarks.ts
            test/e2e/benchmarks/utils/gated-metrics.ts
            test/e2e/benchmarks/utils/thresholds.ts
            test/e2e/benchmarks/utils/statistics.ts
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install tsx and runtime deps
        run: npm install --no-save tsx @metamask/utils
        shell: bash

      - name: Download all benchmark artifacts
        id: download-benchmarks
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: benchmark-*.json
          path: benchmark-results/
          merge-multiple: true

      # skip-benchmark-gate label: convenience escape hatch for Phase 2–3.
      # Honored on pull_request runs and on release/* push runs (RC validation)
      # by resolving the open PR(s) containing the commit; never on main pushes.
      # Labels are read at run time, so re-running this job picks up a label
      # added after the failure.
      # Remove when graduating to Phase 4 (required check) — at that point,
      # use admin bypass or update thresholds instead.
      - name: Check for skip label
        id: skip-check
        continue-on-error: true
        if: ${{ steps.download-benchmarks.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = 'pull_request' ]; then
            PR_NUMBERS="$EVENT_PR_NUMBER"
          elif [[ "$EVENT_REF" == refs/heads/release/* ]]; then
            PR_NUMBERS=$(gh api "repos/$REPO/commits/$COMMIT_SHA/pulls" --jq '.[] | select(.state == "open") | .number')
          else
            PR_NUMBERS=''
          fi
          for pr in $PR_NUMBERS; do
            LABELS=$(gh api "repos/$REPO/issues/$pr/labels" --jq '.[].name')
            if echo "$LABELS" | grep -qx 'skip-benchmark-gate'; then
              echo "skip-benchmark-gate label found on PR #$pr — skipping quality gate"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          done
        shell: bash

      - name: Run quality gate
        if: >-
          ${{
            steps.download-benchmarks.outcome == 'success' &&
            steps.skip-check.outputs.skip != 'true'
          }}
        run: ./node_modules/.bin/tsx development/metamaskbot-build-announce/compare-benchmarks.ts --current ./benchmark-results/
        shell: bash

  # Pushes benchmark results to extension_benchmark_stats (performance_data.json) for
  # historical comparison in PR comments. Runs on main/release branch pushes only.
  # Skip on fork repos — only store stats on the canonical repository.
  store-benchmark-stats:
    name: store-benchmark-stats (main/release only)
    continue-on-error: true
    needs:
      - benchmarks
      - benchmarks-page-load
    if: >-
      ${{
        !cancelled() &&
        github.event_name == 'push' &&
        (github.ref_name == 'main' || startsWith(github.ref, 'refs/heads/release/')) &&
        !github.event.repository.fork
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.ref_name == github.event.repository.default_branch && 'default-branch' || 'release-ci' }}
    env:
      HEAD_COMMIT_HASH: ${{ github.sha }}
      OWNER: ${{ github.repository_owner }}
      BRANCH_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all performance benchmark artifacts
        id: download-perf-benchmark
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: benchmark-*.json
          path: benchmark-results/
          merge-multiple: true

      - name: Get token
        id: token
        if: steps.download-perf-benchmark.outcome == 'success'
        uses: MetaMask/github-tools/.github/actions/get-token@v1
        with:
          token-exchange-url: ${{ vars.TOKEN_EXCHANGE_URL }}
          target-repository: MetaMask/extension_benchmark_stats
          permissions: |
            contents: write

      - name: Commit performance stats to extension_benchmark_stats
        if: steps.download-perf-benchmark.outcome == 'success'
        continue-on-error: true
        run: .github/scripts/benchmark-stats-commit.sh
        env:
          BENCHMARK_DATA_TYPE: performance
          BENCHMARK_RESULTS_DIR: benchmark-results
          EXTENSION_BENCHMARK_STATS_TOKEN: ${{ steps.token.outputs.token }}
